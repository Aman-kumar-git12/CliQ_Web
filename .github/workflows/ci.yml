# Runs on every push and pull request: the code must lint, be formatted, type-check, pass its tests and build.
# The e2e and Lighthouse jobs run in parallel with it; neither needs a real backend.
name: CI

on:
    push:
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
              env:
                  VITE_BACKEND_URL: https://example.invalid

    # Playwright against a production build; every API call is answered by e2e/support/mockApi.js
    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

    # Lighthouse scores for / and /login. Assertions only warn (see lighthouserc.json); reports are kept as an artifact.
    lighthouse:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            # The API URL points at the preview server itself: /auth/me then answers at once (with the app's HTML,
            # i.e. "not logged in"), so the pages render as for a logged-out visitor instead of waiting on retries.
            - run: npm run build
              env:
                  VITE_BACKEND_URL: http://localhost:4320
            - run: npm run lhci
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: lighthouse-reports
                  path: .lighthouseci/
                  retention-days: 7
